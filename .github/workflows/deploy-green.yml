name: Deploy Django CRM to GREEN

on:
  push:
    branches:
      - develop

jobs:
  deploy-green:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3️⃣ CI build & dependency validation
      - name: Install dependencies (CI validation)
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      # 4️⃣ Django system checks
      - name: Django system checks
        run: |
          source venv/bin/activate
          cd dcrm
          python manage.py check

      # 5️⃣ Setup SSH (for EC2 access)
      - name: Setup SSH
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}

      # 6️⃣ Deploy to GREEN on EC2
      - name: Deploy to GREEN environment
        run: |
          ssh -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            set -e
            echo "🚀 Deploying Django CRM to GREEN..."

            cd /var/www/django-crm/crm-green

            echo "📥 Fetching latest code"
            git fetch origin
            git checkout develop
            git pull origin develop

            echo "🐍 Activating virtual environment"
            source .venv/bin/activate

            echo "📦 Installing dependencies"
            pip install -r requirements.txt

            cd dcrm

            echo "🗄️ Running migrations"
            python manage.py migrate

            echo "🔁 Restarting GREEN app on port 8001"
            pkill -f "runserver 0.0.0.0:8001" || true
            nohup python manage.py runserver 0.0.0.0:8001 > green.log 2>&1 &

            echo "✅ GREEN app is running on port 8001"
          EOF

      # 7️⃣ Health check (CRITICAL)
      - name: Health check GREEN
        run: |
          echo "⏳ Waiting for app to start..."
          sleep 6
          curl -f http://${{ secrets.SERVER_IP }}:8001

      # 8️⃣ Deployment success
      - name: Deployment success
        if: success()
        run: echo "✅ GREEN deployment successful"

      # 9️⃣ Deployment failure
      - name: Deployment failed
        if: failure()
        run: echo "❌ GREEN deployment failed — BLUE untouched"
