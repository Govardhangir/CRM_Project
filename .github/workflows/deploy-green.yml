name: Deploy Django CRM to GREEN

on:
  push:
    branches:
      - develop

jobs:
  deploy-green:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Install dependencies (CI validation)
      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Django checks
      - name: Django system checks
        run: |
          source venv/bin/activate
          cd dcrm
          python manage.py check

      # 5. Install SSH key
      - name: Setup SSH access
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}

      # 6. Deploy to GREEN
      - name: Deploy to GREEN environment
        run: |
          ssh gova@${{ secrets.SERVER_IP }} << 'EOF'
            set -e
            cd /var/www/django-crm/crm-green

            git pull origin develop

            if [ ! -d ".venv" ]; then
              python3 -m venv .venv
            fi

            source .venv/bin/activate
            pip install -r requirements.txt

            cd dcrm
            python manage.py migrate

            tmux kill-session -t green || true
            tmux new-session -d -s green "python manage.py runserver 0.0.0.0:8001"
          EOF

      # 7. Health check
      - name: Health check GREEN
        run: |
          sleep 5
          curl -f http://${{ secrets.SERVER_IP }}:8001

      # 8. Deployment status
      - name: Deployment success
        if: success()
        run: echo "GREEN deployment successful"

      - name: Deployment failure
        if: failure()
        run: echo "GREEN deployment failed – Blue untouched"
