name: Deploy Django CRM to GREEN

on:
  push:
    branches:
      - develop

jobs:
  deploy-green:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3️⃣ Install dependencies (CI validation)
      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      # 4️⃣ Django checks
      - name: Django system checks
        run: |
          source venv/bin/activate
          cd dcrm
          python manage.py check

      # 5️⃣ Setup SSH
      - name: Setup SSH
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}

      # 6️⃣ Deploy to GREEN
      - name: Deploy to GREEN environment
        run: |
          ssh -o StrictHostKeyChecking=no \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            set -e
            echo "🚀 Deploying to GREEN..."

            cd /var/www/django-crm/crm-green

            git pull origin develop

            source .venv/bin/activate
            pip install -r requirements.txt

            cd dcrm
            python manage.py migrate

            pkill -f "runserver 0.0.0.0:8001" || true
            nohup python manage.py runserver 0.0.0.0:8001 > green.log 2>&1 &

            echo "✅ GREEN app started on port 8001"
          EOF

      # 7️⃣ Health check
      - name: Health check GREEN
        run: |
          sleep 5
          curl -f http://${{ secrets.SERVER_IP }}:8001

      # 8️⃣ Success message
      - name: Deployment success
        if: success()
        run: echo "✅ GREEN deployment successful"

      # 9️⃣ Failure message
      - name: Deployment failed
        if: failure()
        run: echo "❌ GREEN deployment failed"

