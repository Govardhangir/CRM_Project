name: Deploy Django CRM to GREEN

on:
  push:
    branches:
      - develop

jobs:
  deploy-green:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3️⃣ CI dependency validation
      - name: Install dependencies (CI validation)
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      # 4️⃣ Django system checks
      - name: Django system checks
        run: |
          source venv/bin/activate
          cd dcrm
          python manage.py check

      # 5️⃣ Setup SSH
      - name: Setup SSH
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}

      # 6️⃣ Deploy to GREEN (FORCE SYNC)
      - name: Deploy to GREEN environment
        run: |
          ssh -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            set -e
            echo "🚀 Deploying to GREEN..."

            cd /var/www/django-crm/crm-green

            git fetch origin
            git reset --hard origin/develop
            git clean -fd

            source .venv/bin/activate
            pip install -r requirements.txt

            cd dcrm
            python manage.py migrate

            pkill -f "runserver 0.0.0.0:8001" || true

            nohup python manage.py runserver 0.0.0.0:8001 \
              > /var/www/django-crm/crm-green/green.log 2>&1 &

            sleep 3

            ss -lntp | grep 8001 || (echo "❌ Django not listening on 8001" && exit 1)

            echo "✅ GREEN started successfully"
          EOF

      # 7️⃣ Health check (LOCALHOST – FIXED)
      - name: Health check GREEN (localhost)
        run: |
          echo "⏳ Checking GREEN from inside EC2..."
          ssh -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
          "curl -f http://127.0.0.1:8001/admin/login/"

      # 8️⃣ Success
      - name: Deployment success
        if: success()
        run: echo "✅ GREEN deployment successful"

      # 9️⃣ Failure
      - name: Deployment failed
        if: failure()
        run: echo "❌ GREEN deployment failed — BLUE untouched"
